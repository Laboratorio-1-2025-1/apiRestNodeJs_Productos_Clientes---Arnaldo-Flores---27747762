version: '2.34.0'

services:
  apiBD:
    image: postgres:16.8-alpine3.20
    container_name: apiBD
    ports:
      - ${EXTERNAL_PORT_BD}:${INTERNAL_PORT_BD}
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./data:/var/lib/postgresql/data

